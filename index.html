<style>
:root{--noir:#09090a;--panneau:#101012;--ligne:#2c2a1e;--jaune:#ffc700;--jaune2:#8a6d00;--rouge:#e5192c;--texte:#efeadc;--doux:#9b9686;--dep:#141410;
--titre:"Chakra Petch","Arial Narrow",sans-serif;--corps:"Rajdhani",system-ui,sans-serif;
--coupe:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--noir);color:var(--texte);font:500 16px/1.4 var(--corps);display:flex;flex-direction:column;min-height:100vh}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jaune);outline-offset:2px}
header{position:relative;display:flex;align-items:center;gap:16px;padding:12px 22px 20px;background:linear-gradient(90deg,#1a1500,var(--noir) 65%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--jaune) 0 12px,#000 12px 24px)}
header img{width:52px;height:52px}
h1{font:700 26px/1 var(--titre);margin:0;letter-spacing:.06em;text-transform:uppercase;animation:glitch .7s steps(2) 1}
h1::after{content:"//";color:var(--rouge);margin-left:10px}
@keyframes glitch{0%{transform:translateX(-5px);text-shadow:3px 0 var(--rouge),-3px 0 var(--jaune)}30%{transform:translateX(4px)}60%{transform:none;text-shadow:-2px 0 var(--rouge)}100%{text-shadow:none}}
h2{font:700 15px/1.2 var(--titre);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;flex:none;background:var(--rouge);clip-path:polygon(0 0,100% 0,100% 60%,60% 100%,0 100%)}
header p{margin:4px 0 0;color:var(--doux);font-size:15px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#carte{position:relative;min-height:60vh;overflow:hidden;touch-action:none;background:
 radial-gradient(circle at 50% 45%,rgba(255,199,0,.08),transparent 60%),
 linear-gradient(rgba(255,199,0,.05) 1px,transparent 1px) 0 0/40px 40px,
 linear-gradient(90deg,rgba(255,199,0,.05) 1px,transparent 1px) 0 0/40px 40px,var(--noir)}
#carte::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#carte::after{content:"";position:absolute;inset:10px;pointer-events:none;z-index:1;background:
 linear-gradient(var(--jaune),var(--jaune)) 0 0/26px 2px no-repeat,linear-gradient(var(--jaune),var(--jaune)) 0 0/2px 26px no-repeat,
 linear-gradient(var(--jaune),var(--jaune)) 100% 0/26px 2px no-repeat,linear-gradient(var(--jaune),var(--jaune)) 100% 0/2px 26px no-repeat,
 linear-gradient(var(--jaune),var(--jaune)) 0 100%/26px 2px no-repeat,linear-gradient(var(--jaune),var(--jaune)) 0 100%/2px 26px no-repeat,
 linear-gradient(var(--jaune),var(--jaune)) 100% 100%/26px 2px no-repeat,linear-gradient(var(--jaune),var(--jaune)) 100% 100%/2px 26px no-repeat}
svg{width:100%;height:100%;display:block;cursor:grab;position:relative}
svg.drag{cursor:grabbing}
.dep{fill-rule:evenodd;fill:var(--dep);stroke:#6b5a00;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.dep.l1{fill:#3d3200}.dep.l2{fill:#6b5600}.dep.l3{fill:#a68300}
.dep:hover{fill:#4d4000}
.dep.sel{fill:#a8101e}
.dep.dim{opacity:.25}
.dep.inreg:not(.l1):not(.l2):not(.l3){fill:#34312a}
.selline{fill:none;stroke:#ff6a76;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hovline{fill:none;stroke:var(--jaune);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.regline{fill:none;stroke:var(--jaune);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 6px var(--jaune))}
.badge text{fill:#fff;font:700 9px var(--titre);paint-order:stroke;stroke:#000;stroke-width:2.5px;text-anchor:middle;pointer-events:none}
.badge image{pointer-events:none}
#pays{position:absolute;left:22px;right:22px;top:20px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.tab{background:rgba(0,0,0,.85);border:1px solid var(--jaune2);color:var(--texte);padding:3px 10px;font:700 13px var(--titre);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab:hover{border-color:var(--jaune);color:var(--jaune)}
.tab b{background:var(--rouge);color:#fff;font-size:11px;padding:0 5px;min-width:18px;text-align:center}
.tab[aria-pressed=true]{background:var(--jaune);color:#000;border-color:var(--jaune)}
.lbl{fill:var(--doux);font:600 15px var(--titre);text-anchor:middle;pointer-events:none}
.legende{position:absolute;left:22px;bottom:22px;z-index:2;display:flex;gap:16px;background:rgba(0,0,0,.8);border:1px solid var(--jaune2);padding:6px 12px;font:600 13px var(--titre);align-items:center}
.legende img{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.zoom{position:absolute;right:22px;bottom:22px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;background:#000;border:1px solid var(--jaune2);color:var(--jaune);font-size:20px;cursor:pointer}
.zoom button:hover{border-color:var(--jaune);background:#1a1500}
#tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--jaune);padding:5px 10px;font:600 13px var(--titre);display:none;z-index:5;white-space:nowrap;color:var(--jaune)}
aside{background:var(--panneau);border-left:3px solid var(--rouge);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px}
section+section{border-top:1px dashed var(--jaune2);padding-top:20px}
.btn{background:var(--jaune);color:#000;border:0;padding:10px 18px;font:700 14px var(--titre);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none;clip-path:var(--coupe)}
.btn:hover{background:#ffdb4d}
.btn.ghost{background:none;color:var(--texte);border:1px solid var(--jaune2);clip-path:none}
.btn.ghost:hover{border-color:var(--jaune);color:var(--jaune)}
.btn.danger{background:none;color:#ff5a68;border:1px solid var(--rouge);clip-path:none}
.go{display:flex;justify-content:center;margin-top:8px;background:var(--rouge);color:#fff;padding:8px 14px;font:700 13px var(--titre);text-transform:uppercase;letter-spacing:.05em;text-decoration:none;clip-path:var(--coupe)}
.go:hover{background:var(--jaune);color:#000}
.lien{color:var(--jaune);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.user{display:flex;gap:12px;align-items:center}
.user img{width:40px;height:40px;clip-path:var(--coupe)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{background:var(--noir);border:2px solid var(--ligne);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 14px var(--titre);text-transform:uppercase}
.role img{width:56px;height:56px}
.role small{font:500 14px var(--corps);color:var(--doux);text-align:center;text-transform:none}
.role:hover{border-color:var(--jaune2)}
.role[aria-pressed=true]{border-color:var(--jaune);background:#221b00;box-shadow:0 0 12px rgba(255,199,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ligne);background:var(--noir);padding:2px 9px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--jaune2)}
.chip[aria-pressed=true],.chip.dep-chip{background:var(--rouge);border-color:var(--rouge);color:#fff}
textarea,input.champ{width:100%;background:var(--noir);border:1px solid var(--jaune2);padding:8px;resize:vertical}
textarea{min-height:64px}
textarea:focus,input.champ:focus{border-color:var(--jaune);outline:0;box-shadow:0 0 8px rgba(255,199,0,.3)}
input.champ.mauvais{border-color:var(--rouge)}
label.f{display:flex;align-items:center;gap:8px;cursor:pointer}
label.f img{width:26px;height:26px}
label.f input{accent-color:var(--jaune);width:18px;height:18px}
.entry{display:flex;gap:10px;padding:10px;margin-bottom:8px;background:#0a0a0b;border:1px solid var(--ligne);border-left:4px solid var(--jaune)}
.entry.meneur{border-left-color:var(--rouge)}
.entry>img{width:38px;height:38px;flex:none;clip-path:var(--coupe)}
.entry>div{min-width:0;flex:1}
.entry .r{width:22px;height:22px;vertical-align:-5px;margin-right:6px}
.entry a.nom{color:var(--jaune);font-weight:700;text-decoration:none}
.entry a.nom:hover{text-decoration:underline}
.entry p{margin:2px 0 0;color:var(--doux);font-size:14px;overflow-wrap:anywhere}
.doux{color:var(--doux);font-size:14px;margin:6px 0 0}
.stats{max-height:340px;overflow:auto}
.ligne{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px;align-items:center;width:100%;padding:5px 0;border:0;border-bottom:1px solid var(--ligne);color:inherit;text-align:left;background:linear-gradient(90deg,rgba(255,199,0,.16) var(--p),transparent var(--p))}
button.ligne{cursor:pointer}button.ligne:hover{background-color:#1a1500}
.ligne.tete{position:sticky;top:0;background:var(--panneau);border-bottom:1px solid var(--jaune2);z-index:1;color:var(--doux);font:700 12px var(--titre)}
.ligne.tete img{width:22px;height:22px;display:block;margin:0 auto 1px}
.ligne.tete span{text-align:center}
.ligne .nom{padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .n{text-align:center;font:700 15px var(--titre)}
.n.j{color:var(--jaune)}.n.m{color:#ff5a68}.n.z{color:#4a4a44}
.erreur{background:#2a0a0e;border:1px solid var(--rouge);padding:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--jaune);color:#000;font:700 14px var(--titre);padding:10px 20px;display:none;z-index:9;clip-path:var(--coupe)}
@media (max-width:860px){main{grid-template-columns:1fr}aside{border-left:0;border-top:3px solid var(--rouge)}#carte{min-height:55vh}header p{display:none}h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  etat: 'La connexion a expiré. Réessayez.', jeton: 'Discord a refusé la connexion. Réessayez.',
  profil: 'Impossible de lire votre profil Discord.', serveur: 'Erreur du serveur. Réessayez plus tard.',
  membre: 'Seuls les membres du serveur Discord peuvent s’inscrire.'
};

let IDX = [], MAPS = {}, UNITS = {}, MAP, country = 'FR', entries = [], me = null, draft = null;
let focus = null, focusReg = null, statMode = 'pays', vb, vb0, drag = null, moved = false;
const filter = { joueur: true, meneur: true };
const svg = $('#svg');
const paysNom = id => IDX.find(c => c.id === id)?.nom || id;

async function api(url, opt) {
  const r = await fetch(url, opt && { ...opt, headers: { 'Content-Type': 'application/json' }, body: opt.body && JSON.stringify(opt.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erreur');
  return j;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2500); }

async function init() {
  const q = new URLSearchParams(location.search).get('erreur');
  if (q) { $('#erreur').append(h('div', { class: 'erreur' }, ERR[q] || 'Connexion impossible.')); history.replaceState(null, '', '/'); }
  [IDX, me, entries] = await Promise.all([fetch('/maps/index.json').then(r => r.json()), api('/api/me'), api('/api/entries')]);
  await Promise.all(IDX.map(async c => { MAPS[c.id] = await fetch('/maps/' + c.id + '.json').then(r => r.json()); }));
  for (const c of IDX) for (const d of MAPS[c.id].deps) UNITS[d.code] = { ...d, pays: c.id };
  if (me && !me.role) startEdit();
  setCountry('FR');
}

function setCountry(id) {
  country = id; MAP = MAPS[id]; focus = focusReg = null;
  vb0 = MAP.viewBox.split(' ').map(Number); vb = [...vb0];
  svg.innerHTML = '<g>' + MAP.deps.map(d => `<path class="dep" data-c="${d.code}" d="${d.d}"><title>${esc(d.nom)}</title></path>`).join('') + '</g><g id="regs"></g><path id="hov" class="hovline"/>'
    + MAP.labels.map(l => `<text class="lbl" x="${l.x}" y="${l.y}">${esc(l.t)}</text>`).join('') + '<g id="badges"></g>';
  setView(); renderAll();
}

const byDep = () => {
  const m = {};
  for (const e of entries) {
    if (!filter[e.role]) continue;
    for (const c of e.deps) (m[c] ||= { joueur: [], meneur: [] })[e.role].push(e);
  }
  return m;
};
function depName(c, withCountry) {
  const u = UNITS[c]; if (!u) return c;
  const base = u.pays === 'FR' ? `${u.nom} (${c.slice(3)})` : u.nom;
  return withCountry && u.pays !== country ? base + ' · ' + paysNom(u.pays) : base;
}

function renderAll() { renderPays(); renderMap(); renderCompte(); renderFiltres(); renderDetail(); renderStats(); }

function renderPays() {
  // Tri : nombre d'inscrits décroissant, puis ordre alphabétique (aussi pour les pays sans inscrit)
  const list = IDX.map(c => ({ c, n: entries.filter(e => filter[e.role] && e.deps.some(d => UNITS[d]?.pays === c.id)).length }))
    .sort((a, b) => b.n - a.n || a.c.nom.localeCompare(b.c.nom, 'fr'));
  $('#pays').replaceChildren(...list.map(({ c, n }) =>
    h('button', { class: 'tab', 'aria-pressed': c.id === country, onclick: () => setCountry(c.id) }, c.nom, n ? h('b', {}, n) : null)));
}

function renderMap() {
  const m = byDep();
  document.querySelectorAll('.dep').forEach(p => {
    const c = p.dataset.c, n = (m[c]?.joueur.length || 0) + (m[c]?.meneur.length || 0);
    p.setAttribute('class', 'dep' + (n ? ' l' + Math.min(n, 3) : '') + (draft?.deps.has(c) ? ' sel' : '')
      + (focus === c ? ' focus' : '') + (focusReg ? (UNITS[c].region === focusReg ? ' inreg' : ' dim') : ''));
  });
  const rg = focusReg && MAP.reg?.[focusReg];
  // Contours dessinés dans une couche supérieure : un voisin dessiné après ne peut plus les recouvrir
  let top = '';
  if (draft) for (const c of draft.deps) if (UNITS[c]?.pays === country) top += `<path class="selline" d="${UNITS[c].d}"/>`;
  if (rg) top += `<path class="regline" d="${rg.d}"/>`;
  if (focus) top += `<path class="regline" d="${UNITS[focus].d}"/>`;
  $('#regs').innerHTML = top;
  const z = Math.pow(vb0[2] / vb[2], .6), s = vb0[2] / 50 / z, fs = vb0[2] / 110 / z;
  $('#badges').innerHTML = MAP.deps.map(d => {
    const e = m[d.code]; if (!e) return '';
    const kinds = ['joueur', 'meneur'].filter(k => e[k].length);
    return kinds.map((k, i) => {
      const x = d.cx - s / 2 + (i - (kinds.length - 1) / 2) * s * 1.05, y = d.cy - s / 2;
      return `<g class="badge" style="opacity:${focusReg && d.region !== focusReg ? .25 : 1}"><image href="${ICON[k]}" x="${x}" y="${y}" width="${s}" height="${s}"/><text x="${x + s - 1}" y="${y + s + 1}" style="font-size:${fs}px;stroke-width:${fs / 3.6}px">${e[k].length}</text></g>`;
    }).join('');
  }).join('');
}

function renderCompte() {
  const el = $('#compte'); el.replaceChildren();
  if (!me) {
    el.append(h('h2', {}, 'Rejoindre la carte'),
      h('p', { class: 'doux' }, 'Connectez-vous avec Discord pour indiquer où vous jouez ou où vous meneriez. Seuls votre pseudo, votre avatar et vos choix sont affichés.'),
      h('p', {}, h('a', { class: 'btn', href: '/auth/discord' }, 'Se connecter avec Discord')));
    return;
  }
  el.append(h('div', { class: 'user' }, h('img', { src: me.avatar, alt: '' }), h('div', {}, h('strong', {}, me.name), h('div', { class: 'doux', style: 'margin:0' }, 'Connecté avec Discord'))),
    h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn ghost', onclick: logout }, 'Se déconnecter')));
  if (!draft) {
    el.append(h('div', { style: 'margin-top:14px' },
      me.role ? [h('h2', {}, 'Mon inscription'),
        h('p', {}, h('img', { src: ICON[me.role], alt: '', style: 'width:22px;vertical-align:-5px;margin-right:6px' }), LABEL[me.role] + ' · ' + me.deps.length + ' zone' + (me.deps.length > 1 ? 's' : '')),
        me.note && h('p', { class: 'doux' }, me.note),
        me.link && h('p', {}, h('a', { class: 'lien', href: me.link, target: '_blank', rel: 'noopener' }, 'Mon annonce sur Discord'))] : null,
      h('button', { class: 'btn', onclick: startEdit }, me.role ? 'Modifier mon inscription' : 'S’inscrire')));
    return;
  }
  const set = draft.deps;
  const roleBtn = (k, sub) => h('button', { class: 'role', 'aria-pressed': draft.role === k, onclick: () => { draft.role = k; renderCompte(); } },
    h('img', { src: ICON[k], alt: '' }), LABEL[k], h('small', {}, sub));
  const chip = (label, codes) => h('button', { class: 'chip', 'aria-pressed': codes.every(c => set.has(c)), onclick: () => {
    const all = codes.every(c => set.has(c)); codes.forEach(c => all ? set.delete(c) : set.add(c)); renderMap(); renderCompte(); renderStats(); } }, label);
  const chips = [chip('Tout : ' + MAP.nom, MAP.deps.map(d => d.code)),
    ...(MAP.regions.length > 1 ? MAP.regions.map(r => chip(r, MAP.deps.filter(d => d.region === r).map(d => d.code))) : [])];
  const nz = set.size;
  el.append(h('div', { style: 'margin-top:16px' },
    h('h2', {}, 'Mon inscription'),
    h('div', { class: 'roles' }, roleBtn('joueur', 'Je cherche une table'), roleBtn('meneur', 'Je cherche des joueurs')),
    h('h2', { style: 'margin-top:16px' }, 'Où ?'),
    h('p', { class: 'doux', style: 'margin:0 0 8px' }, 'Pays affiché : ' + MAP.nom + '. Cliquez sur la carte pour ajouter ou retirer une zone, ou prenez une région entière. Changez d’onglet pour ajouter d’autres pays.'),
    h('div', { class: 'chips' }, chips),
    h('p', { class: 'doux' }, nz ? nz + ' zone' + (nz > 1 ? 's' : '') + ' choisie' + (nz > 1 ? 's' : '') + ' :' : 'Aucune zone choisie.'),
    h('div', { class: 'chips' }, [...set].sort().map(c => h('span', { class: 'chip dep-chip', title: 'Retirer', onclick: () => { set.delete(c); renderMap(); renderCompte(); renderStats(); } }, depName(c, true) + ' ×'))),
    h('h2', { style: 'margin-top:16px' }, 'Mon annonce Discord'),
    h('p', { class: 'doux', style: 'margin:0 0 8px' }, 'Postez votre annonce sur le serveur, faites un clic droit sur le message, « Copier le lien du message », puis collez-le ici. Les intéressés seront renvoyés directement dessus.'),
    h('input', { class: 'champ' + (draft.link && !LIEN.test(draft.link) ? ' mauvais' : ''), type: 'url', placeholder: 'https://discord.com/channels/…', value: draft.link,
      oninput: e => { draft.link = e.target.value.trim(); e.target.classList.toggle('mauvais', !!draft.link && !LIEN.test(draft.link)); } }),
    h('h2', { style: 'margin-top:16px' }, 'Un mot pour les autres (facultatif)'),
    h('textarea', { maxlength: 200, placeholder: 'Jeux, jours disponibles, en ligne ou en présentiel…', oninput: e => draft.note = e.target.value }, draft.note),
    h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'btn', onclick: saveMe }, 'Enregistrer'),
      h('button', { class: 'btn ghost', onclick: () => { draft = null; renderAll(); } }, 'Annuler'),
      me.role && h('button', { class: 'btn danger', onclick: removeMe }, 'Me retirer de la carte'))));
}

function renderFiltres() {
  const el = $('#filtres'); el.replaceChildren(h('h2', {}, 'Afficher'));
  for (const k of ['joueur', 'meneur']) {
    const n = entries.filter(e => e.role === k).length;
    el.append(h('label', { class: 'f', style: 'margin-bottom:8px' },
      h('input', { type: 'checkbox', ...(filter[k] ? { checked: '' } : {}), onchange: e => { filter[k] = e.target.checked; renderAll(); } }),
      h('img', { src: ICON[k], alt: '' }), LABEL[k] + 's', h('span', { class: 'doux', style: 'margin:0' }, '(' + n + ')')));
  }
}

function renderDetail() {
  const el = $('#detail'); el.replaceChildren();
  if (draft) return;
  let title, list;
  if (focus) {
    const e = byDep()[focus] || { joueur: [], meneur: [] }; title = depName(focus, true); list = [...e.meneur, ...e.joueur];
  } else if (focusReg) {
    const codes = new Set(MAP.deps.filter(d => d.region === focusReg).map(d => d.code));
    title = focusReg + ' · ' + MAP.nom;
    list = entries.filter(e => filter[e.role] && e.deps.some(c => codes.has(c))).sort((a, b) => (a.role === 'meneur' ? 0 : 1) - (b.role === 'meneur' ? 0 : 1));
  } else {
    el.append(h('h2', {}, 'Zone'), h('p', { class: 'doux' }, 'Cliquez sur une zone de la carte, ou sur une ligne du classement, pour voir qui y cherche une table ou des joueurs.'));
    return;
  }
  el.append(h('h2', {}, title));
  if (!list.length) el.append(h('p', { class: 'doux' }, 'Personne ici pour l’instant. Soyez le premier !'));
  for (const u of list) el.append(h('div', { class: 'entry ' + u.role }, h('img', { src: u.avatar, alt: '' }),
    h('div', {}, h('div', {}, h('img', { class: 'r', src: ICON[u.role], alt: LABEL[u.role] }),
      h('a', { class: 'nom', href: 'https://discord.com/users/' + u.id, target: '_blank', rel: 'noopener' }, u.name)),
      u.note && h('p', {}, u.note),
      u.link && h('a', { class: 'go', href: u.link, target: '_blank', rel: 'noopener' }, 'Voir l’annonce sur Discord'))));
}

function renderStats() {
  const el = $('#stats'); el.replaceChildren(h('h2', {}, 'Classement'));
  const regOK = MAP.regions.length > 1;
  if (statMode === 'region' && !regOK) statMode = 'dep';
  el.append(h('div', { class: 'chips', style: 'margin-bottom:6px' }, [['pays', 'Pays'], regOK && ['region', 'Régions'], ['dep', MAP.unite]].filter(Boolean).map(([k, t]) =>
    h('button', { class: 'chip', 'aria-pressed': statMode === k, onclick: () => { statMode = k; renderStats(); } }, t))));
  if (statMode !== 'pays') el.append(h('p', { class: 'doux', style: 'margin:0 0 8px' }, MAP.nom));
  const rows = new Map();
  for (const e of entries) {
    const seen = new Set();
    for (const c of e.deps) {
      const u = UNITS[c]; if (!u) continue;
      let key, label;
      if (statMode === 'pays') { key = u.pays; label = paysNom(key); }
      else if (u.pays !== country) continue;
      else if (statMode === 'region') { if (!u.region) continue; key = label = u.region; }
      else { key = c; label = depName(c); }
      if (seen.has(key)) continue; seen.add(key);
      const r = rows.get(key) || { key, label, joueur: 0, meneur: 0 };
      r[e.role]++; rows.set(key, r);
    }
  }
  const list = [...rows.values()].sort((a, b) => (b.joueur + b.meneur) - (a.joueur + a.meneur) || a.label.localeCompare(b.label, 'fr'));
  if (!list.length) { el.append(h('p', { class: 'doux' }, 'Aucune inscription ici pour l’instant.')); return; }
  const max = Math.max(...list.map(r => r.joueur + r.meneur)), num = (n, c) => h('span', { class: 'n ' + (n ? c : 'z') }, n || '–');
  const box = h('div', { class: 'stats' }, h('div', { class: 'ligne tete' }, h('span', {}), h('span', {}, h('img', { src: ICON.joueur, alt: 'Joueurs' }), 'Joueurs'), h('span', {}, h('img', { src: ICON.meneur, alt: 'Meneurs' }), 'Meneurs')));
  for (const r of list) {
    const kids = [h('span', { class: 'nom', title: r.label }, r.label), num(r.joueur, 'j'), num(r.meneur, 'm')];
    const st = '--p:' + Math.round((r.joueur + r.meneur) / max * 100) + '%';
    const go = () => {
      if (statMode === 'pays') return setCountry(r.key);
      if (statMode === 'region') { focus = null; focusReg = r.key; zoomTo(MAP.deps.filter(d => d.region === r.key)); }
      else { focus = r.key; focusReg = null; zoomTo([UNITS[r.key]]); }
      renderMap(); renderDetail(); $('#detail').scrollIntoView({ block: 'nearest' });
    };
    box.append(h('button', { class: 'ligne', style: st, onclick: go }, kids));
  }
  el.append(box);
}

function startEdit() { draft = { role: me.role, deps: new Set(me.deps), note: me.note || '', link: me.link || '' }; renderAll(); }
async function saveMe() {
  if (!draft.role) return toast('Choisissez joueur ou meneur');
  if (!draft.deps.size) return toast('Choisissez au moins une zone');
  if (!LIEN.test(draft.link)) return toast('Collez le lien de votre message Discord');
  try {
    await api('/api/me', { method: 'PUT', body: { role: draft.role, deps: [...draft.deps], note: draft.note, link: draft.link } });
    [me, entries] = await Promise.all([api('/api/me'), api('/api/entries')]);
    draft = null; renderAll(); toast('Inscription enregistrée');
  } catch (e) { toast(e.message); }
}
async function removeMe() {
  if (!confirm('Vous retirer de la carte ?')) return;
  await api('/api/me', { method: 'DELETE' }); me = null; draft = null; entries = await api('/api/entries'); renderAll(); toast('Vous avez été retiré de la carte');
}
async function logout() { await api('/auth/logout', { method: 'POST' }); me = null; draft = null; renderAll(); }

// --- Interactions carte ---
function setView() { svg.setAttribute('viewBox', vb.join(' ')); }
function zoomTo(us) {
  const x0 = Math.min(...us.map(d => d.b[0])), y0 = Math.min(...us.map(d => d.b[1])), x1 = Math.max(...us.map(d => d.b[2])), y1 = Math.max(...us.map(d => d.b[3]));
  const p = Math.max(x1 - x0, y1 - y0) * .12 + 6, r = svg.getBoundingClientRect(), asp = r.width / r.height;
  let w = x1 - x0 + 2 * p, hh = y1 - y0 + 2 * p;
  if (w / hh < asp) w = hh * asp; else hh = w / asp;
  vb = [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - hh / 2, w, hh]; setView();
}
function zoom(f, cx, cy) {
  const nw = Math.min(vb0[2] * 1.2, Math.max(vb0[2] / 14, vb[2] / f)), k = nw / vb[2];
  cx ??= vb[0] + vb[2] / 2; cy ??= vb[1] + vb[3] / 2;
  vb = [cx - (cx - vb[0]) * k, cy - (cy - vb[1]) * k, vb[2] * k, vb[3] * k];
  setView(); renderMap();
}
const toSvg = (x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(svg.getScreenCTM().inverse()); };
svg.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); zoom(e.deltaY < 0 ? 1.25 : .8, p.x, p.y); }, { passive: false });
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = false; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  moved = true; svg.classList.add('drag');
  const s = svg.getScreenCTM().a; vb[0] -= dx / s; vb[1] -= dy / s; drag = { x: e.clientX, y: e.clientY }; setView();
});
addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('click', e => {
  if (moved) return;
  const p = e.target.closest('.dep'); if (!p) return;
  const c = p.dataset.c;
  if (draft) { draft.deps.has(c) ? draft.deps.delete(c) : draft.deps.add(c); renderMap(); renderCompte(); renderStats(); }
  else { focus = c; focusReg = null; renderMap(); renderDetail(); }
});
svg.addEventListener('mousemove', e => {
  const p = e.target.closest('.dep'), t = $('#tip');
  if (!p) { t.style.display = 'none'; $('#hov').removeAttribute('d'); return; }
  const c = p.dataset.c, m = byDep()[c];
  $('#hov').setAttribute('d', UNITS[c].d);
  t.textContent = depName(c) + (m ? ` — ${m.meneur.length} meneur(s), ${m.joueur.length} joueur(s)` : '');
  t.style.display = 'block'; t.style.left = e.clientX + 14 + 'px'; t.style.top = e.clientY + 14 + 'px';
});
svg.addEventListener('mouseleave', () => { $('#tip').style.display = 'none'; $('#hov').removeAttribute('d'); });
$('#zin').onclick = () => zoom(1.5); $('#zout').onclick = () => zoom(1 / 1.5);
$('#zre').onclick = () => { vb = [...vb0]; setView(); renderMap(); };

init().catch(() => $('#erreur').append(h('div', { class: 'erreur' }, 'Impossible de charger la carte. Rechargez la page.')));
</script>
<script>window.__login=async()=>{me=await api('/api/me');startEdit();};</script>
</body>
